<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#234d3f">
  <title>Leisure · 看图推理</title>
  <link rel="stylesheet" href="style.css?v=2">
</head>
<body>
  <header><a class="brand" href="./">◈ LEISURE <span>闲暇推理社</span></a><span class="badge">看图推理 · 第 1 案</span></header>
  <main>
    <section class="intro">
      <div><span class="eyebrow">午后咖啡馆</span><h1>谁坐在哪儿？</h1><p>看线索，把四位客人和饮品放回座位。</p></div>
      <div class="howto" aria-label="玩法"><span><b>1</b> 看图找关系</span><i>→</i><span><b>2</b> 点空位选图</span><i>→</i><span><b>3</b> 验证答案</span></div>
    </section>
    <section class="game" aria-labelledby="scene-title">
      <div class="section-head"><h2 id="scene-title">☀ 还原咖啡馆</h2><button id="reset" class="text-button">↺ 重来</button></div>
      <div class="scene">
        <div class="scene-direction"><span>▥ 窗边</span><span class="direction-line">从左到右，座位相邻 →</span><span>门口 ▯</span></div>
        <div id="board" class="board"></div>
        <div class="table-edge" aria-hidden="true"></div>
      </div>
      <div class="scene-bottom"><span>每个人、每杯饮品只用一次</span><span id="progress">已放置 0 / 8</span></div>
      <div class="actions"><button id="check" class="primary">✓ 验证答案</button><button id="hint" class="secondary">✦ 图解提示</button></div>
      <div id="message" role="status" aria-live="polite"></div>
      <div id="hint-panel" hidden></div>
      <details id="explanation" hidden><summary>看看图解过程</summary><div id="solution-steps"></div></details>
    </section>
    <section class="clue-section" aria-labelledby="clue-title">
      <div class="section-head"><h2 id="clue-title">✧ 六张线索卡</h2><span>点一下，标记已用 ✓</span></div>
      <ol id="clues"></ol>
      <details class="cast"><summary>认识客人和饮品</summary><div id="legend"></div><p>「可可」是客人；「热可可」是棕色杯装饮品。</p></details>
    </section>
  </main>
  <footer>LEISURE · 给大脑一点游玩时间 <span id="save-status">进度自动保存在本机</span></footer>
  <dialog id="picker" aria-labelledby="picker-title">
    <div class="picker-head"><h2 id="picker-title">选择客人</h2><button id="close-picker" class="icon-button" aria-label="关闭选择">×</button></div>
    <p id="picker-note"></p><div id="picker-options"></div><button id="clear-choice" class="clear-button">移走当前选择</button>
  </dialog>
  <script src="visuals.js?v=2"></script><script src="app.js?v=2"></script>
</body>
</html>
